<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BubbleCap</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar-left">
                <a href="index.html">
                    <img class="navbar_logo" src="img/bubblecap.png" alt="logo.png" />
                </a>
            </div>
            <div class="navbar-right">
                <div>
                    <a href="#">
                        <img class="cart_icon" src="img/cart.png" alt="cart_icon.png" />
                    </a>
                </div>
                <div class="dropdown">
                    <p class="dropbtn">More</p>
                    <div class="dropdown-content">
                        <a href="#">*About</a>
                        <a href="register.html">*Register</a>
                        <a href="#footer">*Contact</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="stock-title">
            <p>BubbleCap's stock:</p>
        </div>
        <div class="cards container">
            <div class="cards-left">
                <div class="card">
                    <p class="item-name">TGTTEL Cap</p>
                    <img src="img/tgttel.png" alt="tgttelcap" />
                    <p class="price">$Free</p>
                </div>
                <div class="card">
                    <p class="item-name">Mtn Dew Cap</p>
                    <img src="img/mtndewcap.png" alt="mountaindewcap" />
                    <p class="price">$Free</p>
                </div>
                <div class="card">
                    <p class="item-name">Mountain Dew Drink</p>
                    <img src="img/mtndewcan.png" alt="mtndew" />
                    <p class="price">$Free</p>
                </div>
            </div>
            <div class="card-midden">
                <div class="card">
                    <p class="item-name">Cookie Monster Cap</p>
                    <img src="img/cookiemonster.png" alt="cookiemonstercap" />
                    <p class="price">$Free</p>
                </div>
                <div class="card">
                    <p class="item-name">Propeller Cap</p>
                    <img src="img/propellercap.png" alt="propellercap" />
                    <p class="price">$Free</p>
                </div>
                <div class="card">
                    <p class="item-name">Pepsi Drink</p>
                    <img src="img/pepsican.png" alt="pepsican" />
                    <p class="price">$Free</p>
                </div>
            </div>
            <div class="cards-right">
                <div class="card">
                    <p class="item-name">Coca Cola Cap</p>
                    <img src="img/cocacola.png" alt="cocacolacap" />
                    <p class="price">$Free</p>
                </div>
                <div class="card">
                    <p class="item-name">Monster Cap</p>
                    <img src="img/monstercap.png" alt="monstercap" />
                    <p class="price">$Free</p>
                </div>
                <div class="card">
                    <p class="item-name">7Up Drink</p>
                    <img src="img/7upcan.png" alt="7upcan" />
                    <p class="price">$Free</p>
                </div>
            </div>
        </div>
        <div class="footer" id="footer">
            <div>
                <p>Contact</p>
                <a href="admin.html">
                    <p>admin</p>
                </a>
            </div>
        </div>
    </body>
</html>
