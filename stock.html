<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BubbleCap</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar-left">
                <a href="index.html">
                    <img class="navbar_logo" src="img/bubblecap.png" alt="logo.png" />
                </a>
            </div>
            <div class="navbar-right">
                <div>
                    <a href="#">
                        <img class="cart_icon" src="img/cart.png" alt="cart_icon.png" />
                    </a>
                </div>
                <div class="dropdown">
                    <p class="dropbtn">More</p>
                    <div class="dropdown-content">
                        <a href="#">*Login</a>
                        <a href="#">*Register</a>
                        <a href="#">*Contact</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="cards container">
            <div class="cards-left">
                <div class="card">
                    <p>TGTTEL Cap</p>
                    <img src="img/tgttel.png" alt="tgttelcap" />
                    <p>$19,99</p>
                </div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
            <div class="card-midden">
                <div class="card">
                    <p>Cookie Monster Cap</p>
                    <img src="img/cookiemonster.png" alt="cookiemonstercap" />
                    <p>$14,99</p>
                </div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
            <div class="cards-right">
                <div class="card">
                    <p>Coca Cola Cap</p>
                    <img src="img/cocacola.png" alt="cocacolacap" />
                    <p>$14,99</p>
                </div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
        </div>
        <div class="footer">
            <div>
                <p>Contact</p>
            </div>
        </div>
    </body>
</html>
