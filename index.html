<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BubbleCap</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar-left">
                <img class="navbar_logo" src="img/bubblecap.png" alt="logo.png" />
            </div>
            <div class="navbar-right">
                <div>
                    <a href="#">
                        <img class="cart_icon" src="img/cart.png" alt="cart_icon.png" />
                    </a>
                </div>
                <div class="dropdown">
                    <button class="dropbtn">More</button>
                    <div class="dropdown-content">
                        <a href="#">Login</a>
                        <a href="#">Register</a>
                        <a href="#">Contact</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="hero">
            <div class="hero-left"></div>
            <div class="hero-right">
                <p>
                    Simple selection,<br />
                    strong choices
                </p>
            </div>
        </div>

</html>
